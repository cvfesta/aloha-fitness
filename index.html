<html lang="en" dir="ltr" data-bs-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="author" content="Christian Festa" />
    <title>Aloha Fitness · Outdoor Strength for Moms in Rocklin, CA</title>
    <meta name="description" content="Aloha Fitness is an outdoor strength community for moms in Rocklin, CA. Group classes, online coaching, and science-backed nutrition — built for real life." />
    <meta name="keywords" content="science-based nutrition, nutrition program, group fitness, outdoor workouts, moms fitness, strength training, Rocklin" />

    <!-- Open Graph / social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Aloha Fitness" />
    <meta property="og:url" content="https://www.alohafitness.net/" />
    <meta property="og:title" content="Aloha Fitness · Outdoor Strength for Moms in Rocklin, CA" />
    <meta property="og:description" content="An outdoor strength community and nutrition program for moms in Rocklin, CA — group classes, online coaching, and a free first class." />
    <meta property="og:image" content="https://www.alohafitness.net/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Aloha Fitness · Outdoor Strength for Moms in Rocklin, CA" />
    <meta name="twitter:description" content="An outdoor strength community and nutrition program for moms in Rocklin, CA — group classes, online coaching, and a free first class." />
    <meta name="twitter:image" content="https://www.alohafitness.net/og-image.jpg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..900,0..100;1,9..144,300..900,0..100&family=Manrope:wght@300..800&display=swap" rel="stylesheet" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/heart.svg" />
    <link rel="apple-touch-icon" href="/heart.png" />

    <!-- Structured data — local business (helps local search results) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "name": "Aloha Fitness",
        "description": "An outdoor strength community and nutrition program for moms in Rocklin, CA — group classes and online coaching.",
        "url": "https://www.alohafitness.net/",
        "image": "https://www.alohafitness.net/og-image.jpg",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Rocklin",
          "addressRegion": "CA",
          "addressCountry": "US"
        },
        "areaServed": {
          "@type": "City",
          "name": "Rocklin"
        },
        "priceRange": "$$",
        "sameAs": ["https://www.instagram.com/taniafesta.aloha"]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!--
      Hidden static forms — Netlify scans built HTML at deploy time for forms with
      data-netlify="true". The React forms POST to these names.
    -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="bot-field" />
      <input type="text" name="firstName" />
      <input type="text" name="lastName" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
    </form>
    <form name="registration" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="bot-field" />
      <input type="text" name="firstName" />
      <input type="text" name="lastName" />
      <input type="tel" name="phoneNumber" />
      <input type="email" name="email" />
      <select name="trainingSession">
        <option value="monday_wednesday_strength_830am"></option>
        <option value="saturday_strength_730am"></option>
      </select>
    </form>
  </body>
</html>
