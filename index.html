<!doctype html>
<html lang="en" dir="ltr" data-bs-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="author" content="Christian Festa" />
    <title>Aloha Bliss Premium Yoga Mat · Eco-Friendly Natural Rubber</title>
    <meta name="description" content="A studio-grade yoga mat that grips when you sweat, supports knees and wrists, and rolls light. Eco-friendly natural rubber — 72&quot; × 27&quot;. Available on Amazon." />
    <meta name="keywords" content="yoga mat, premium yoga mat, eco-friendly yoga mat, natural rubber yoga mat, non-slip yoga mat, thick yoga mat, aloha bliss, aloha fitness, outdoor fitness rocklin" />
    <link rel="canonical" href="https://www.alohafitness.net/" />

    <!-- Open Graph / social sharing -->
    <meta property="og:type" content="product" />
    <meta property="og:site_name" content="Aloha Fitness" />
    <meta property="og:url" content="https://www.alohafitness.net/" />
    <meta property="og:title" content="Aloha Bliss Premium Yoga Mat · Eco-Friendly Natural Rubber" />
    <meta property="og:description" content="Studio-grade grip, generous cushion, and biodegradable natural rubber — 72&quot; × 27&quot;. Designed by Aloha, available on Amazon." />
    <meta property="og:image" content="https://www.alohafitness.net/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Aloha Bliss Premium Yoga Mat · Eco-Friendly Natural Rubber" />
    <meta name="twitter:description" content="Studio-grade grip, generous cushion, and biodegradable natural rubber — 72&quot; × 27&quot;. Designed by Aloha, available on Amazon." />
    <meta name="twitter:image" content="https://www.alohafitness.net/og-image.jpg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..900,0..100;1,9..144,300..900,0..100&family=Manrope:wght@300..800&display=swap" rel="stylesheet" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/heart.svg" />
    <link rel="apple-touch-icon" href="/heart.png" />

    <!-- Structured data — product (homepage is the yoga mat) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Product",
        "name": "Aloha Bliss Premium Yoga Mat",
        "brand": { "@type": "Brand", "name": "Aloha" },
        "description": "Premium yoga mat in eco-friendly PU and natural rubber — 72\" × 27\", 0.18\" thick. Non-slip, sweat-resistant, lightweight with included carry strap.",
        "image": "https://www.alohafitness.net/og-image.jpg",
        "url": "https://www.alohafitness.net/",
        "category": "Yoga Mats",
        "material": "PU + natural rubber",
        "weight": { "@type": "QuantitativeValue", "value": "7.05", "unitText": "lb" },
        "offers": {
          "@type": "Offer",
          "url": "https://a.co/d/03PJmce1",
          "priceCurrency": "USD",
          "price": "120.00",
          "availability": "https://schema.org/InStock",
          "seller": { "@type": "Organization", "name": "Aloha Fitness" }
        }
      }
    </script>

    <!-- Structured data — local business (helps local search for classes) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "name": "Aloha Fitness",
        "description": "An outdoor strength community and nutrition program for moms in Rocklin, CA — group classes and online coaching.",
        "url": "https://www.alohafitness.net/classes",
        "image": "https://www.alohafitness.net/og-image.jpg",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Rocklin",
          "addressRegion": "CA",
          "addressCountry": "US"
        },
        "areaServed": {
          "@type": "City",
          "name": "Rocklin"
        },
        "priceRange": "$$",
        "sameAs": ["https://www.instagram.com/taniafesta.aloha"]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!--
      Hidden static forms — Netlify scans built HTML at deploy time for forms with
      data-netlify="true". The React forms POST to these names.
    -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="bot-field" />
      <input type="text" name="firstName" />
      <input type="text" name="lastName" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
    </form>
    <form name="registration" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="bot-field" />
      <input type="text" name="firstName" />
      <input type="text" name="lastName" />
      <input type="tel" name="phoneNumber" />
      <input type="email" name="email" />
      <select name="trainingSession">
        <option value="monday_wednesday_strength_830am"></option>
        <option value="saturday_strength_730am"></option>
      </select>
    </form>
  </body>
</html>
